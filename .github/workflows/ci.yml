name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  php-quality:
    name: PHP quality / PHP ${{ matrix.php }}
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php:
          - '7.4'
          - '8.3'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, filter, json, libxml, mbstring, tokenizer, xmlwriter
          coverage: none
          tools: composer:v2

      - name: Locate Composer cache
        id: composer-cache
        shell: bash
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Restore Composer package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-composer-

      - name: Validate Composer metadata
        run: composer validate --strict --no-interaction

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Audit Composer dependencies
        run: composer audit --no-interaction

      - name: Lint PHP
        run: composer lint:php

      - name: Run unit tests
        run: composer test:unit

  wordpress-integration:
    name: WordPress integration / ${{ matrix.profile }}
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        profile:
          - minimum
          - latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run ${{ matrix.profile }} integration profile
        run: scripts/test-integration.sh "${{ matrix.profile }}"

      - name: Upload integration failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-${{ matrix.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: tests/integration/artifacts/
          if-no-files-found: warn
          retention-days: 7

  plugin-check:
    name: Plugin Check
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run zero-error Plugin Check gate
        run: scripts/plugin-check.sh

      - name: Upload Plugin Check failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plugin-check-${{ github.run_id }}-${{ github.run_attempt }}
          path: tests/integration/artifacts/
          if-no-files-found: warn
          retention-days: 7

  admin-browser-smoke:
    name: Authenticated admin smoke
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit Node dependencies
        run: npm audit --audit-level=high

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Prepare isolated Compose configuration
        shell: bash
        run: |
          cp .env.example .env
          sed -i "s/^COMPOSE_PROJECT_NAME=.*/COMPOSE_PROJECT_NAME=wpsoci${{ github.run_id }}a${{ github.run_attempt }}/" .env

      - name: Set up local WordPress
        run: ./scripts/setup-local.sh

      - name: Run authenticated admin smoke
        run: npm run test:e2e

      - name: Capture browser and Compose diagnostics
        if: ${{ always() }}
        shell: bash
        run: |
          mkdir -p test-results/compose
          if [[ -f .env ]]; then
            docker compose ps --all > test-results/compose/compose-ps.log 2>&1 || true
            docker compose logs --no-color > test-results/compose/compose.log 2>&1 || true
          fi
          if [[ -f local-dev/wp-content/debug.log ]]; then
            cp local-dev/wp-content/debug.log test-results/compose/wp-debug.log
          fi

      - name: Clean up isolated Compose project
        if: ${{ always() }}
        shell: bash
        run: |
          if [[ -f .env ]]; then
            ./scripts/reset-local.sh --yes
          fi

      - name: Upload browser failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: admin-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 7

  release-candidate:
    name: Release candidate
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    needs:
      - php-quality
      - wordpress-integration
      - plugin-check
      - admin-browser-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Derive normalized release metadata
        id: release-metadata
        shell: bash
        run: |
          set -Eeuo pipefail

          version="$(sed -n 's/^[[:space:]]*Version:[[:space:]]*\([^[:space:]]*\)[[:space:]]*$/\1/p' plugin-dir/wp-site-options.php | tr -d '\r')"
          if [[ ! "${version}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            printf 'Plugin header Version is not normalized X.Y.Z: %s\n' "${version:-missing}" >&2
            exit 1
          fi

          source_date_epoch="$(git show -s --format=%ct HEAD)"
          if [[ ! "${source_date_epoch}" =~ ^[0-9]+$ ]]; then
            printf 'HEAD commit epoch is not an integer: %s\n' "${source_date_epoch:-missing}" >&2
            exit 1
          fi
          if (( source_date_epoch < 315532800 || source_date_epoch > 4354819198 )); then
            printf 'HEAD commit epoch is outside the ZIP timestamp range: %s\n' "${source_date_epoch}" >&2
            exit 1
          fi
          source_date_epoch="$(( source_date_epoch - ( source_date_epoch % 2 ) ))"

          printf 'version=%s\n' "${version}" >> "${GITHUB_OUTPUT}"
          printf 'source_date_epoch=%s\n' "${source_date_epoch}" >> "${GITHUB_OUTPUT}"
          printf 'RELEASE_VERSION=%s\n' "${version}" >> "${GITHUB_ENV}"
          printf 'SOURCE_DATE_EPOCH=%s\n' "${source_date_epoch}" >> "${GITHUB_ENV}"

      - name: Build and validate deterministic candidate twice
        id: build-candidate
        shell: bash
        run: |
          set -Eeuo pipefail

          first_zip="${GITHUB_WORKSPACE}/dist/wp-site-options.zip"
          second_zip="${RUNNER_TEMP}/wp-site-options-second.zip"

          scripts/build-release-zip.sh "${first_zip}"
          scripts/build-release-zip.sh "${second_zip}"
          scripts/validate-release-zip.sh "${first_zip}" "${RELEASE_VERSION}"
          scripts/validate-release-zip.sh "${second_zip}" "${RELEASE_VERSION}"
          cmp "${first_zip}" "${second_zip}"

          zip_sha256="$(sha256sum "${first_zip}" | awk '{ print $1 }')"
          if [[ ! "${zip_sha256}" =~ ^[0-9a-f]{64}$ ]]; then
            printf 'Unexpected candidate SHA-256: %s\n' "${zip_sha256:-missing}" >&2
            exit 1
          fi
          printf '%s  wp-site-options.zip\n' "${zip_sha256}" > dist/wp-site-options.zip.sha256
          (
            cd dist
            sha256sum -c wp-site-options.zip.sha256
          )

          printf 'zip_sha256=%s\n' "${zip_sha256}" >> "${GITHUB_OUTPUT}"
          printf 'RELEASE_ZIP_SHA256=%s\n' "${zip_sha256}" >> "${GITHUB_ENV}"

      - name: Upload immutable release candidate
        id: upload-candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wp-site-options-candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/wp-site-options.zip
            dist/wp-site-options.zip.sha256
          if-no-files-found: error
          retention-days: 90
          overwrite: false
          compression-level: 0

      - name: Require a fresh artifact download path
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -e "${RUNNER_TEMP}/release-candidate-download" ]]; then
            printf 'Fresh artifact download path already exists.\n' >&2
            exit 1
          fi

      - name: Download candidate by immutable artifact ID
        id: download-candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.upload-candidate.outputs.artifact-id }}
          path: ${{ runner.temp }}/release-candidate-download

      - name: Verify downloaded candidate
        shell: bash
        run: |
          set -Eeuo pipefail

          download_dir="${RUNNER_TEMP}/release-candidate-download"
          downloaded_zip="${download_dir}/wp-site-options.zip"
          downloaded_checksum="${download_dir}/wp-site-options.zip.sha256"

          [[ -f "${downloaded_zip}" && ! -L "${downloaded_zip}" ]]
          [[ -f "${downloaded_checksum}" && ! -L "${downloaded_checksum}" ]]
          mapfile -d '' downloaded_entries < <(find "${download_dir}" -mindepth 1 -maxdepth 1 -print0)
          if (( ${#downloaded_entries[@]} != 2 )); then
            printf 'Downloaded artifact must contain exactly two files.\n' >&2
            exit 1
          fi

          (
            cd "${download_dir}"
            sha256sum -c wp-site-options.zip.sha256
          )
          cmp dist/wp-site-options.zip "${downloaded_zip}"
          scripts/validate-release-zip.sh "${downloaded_zip}" "${RELEASE_VERSION}"

      - name: Publish release candidate summary
        shell: bash
        env:
          COMMIT_SHA: ${{ github.sha }}
          ARTIFACT_NAME: wp-site-options-candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          ARTIFACT_ID: ${{ steps.upload-candidate.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload-candidate.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.upload-candidate.outputs.artifact-digest }}
        run: |
          set -Eeuo pipefail

          [[ "${COMMIT_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${RELEASE_VERSION}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "${SOURCE_DATE_EPOCH}" =~ ^[0-9]+$ ]]
          [[ "${RELEASE_ZIP_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          [[ "${ARTIFACT_NAME}" =~ ^wp-site-options-candidate-[0-9a-f]{40}-[0-9]+-[0-9]+$ ]]
          [[ "${ARTIFACT_ID}" =~ ^[0-9]+$ ]]
          [[ "${ARTIFACT_URL}" =~ ^https://github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+/actions/runs/[0-9]+/artifacts/[0-9]+$ ]]
          [[ "${ARTIFACT_DIGEST}" =~ ^[0-9a-f]{64}$ ]]

          {
            printf '## Release candidate\n\n'
            printf -- '- Commit SHA: `%s`\n' "${COMMIT_SHA}"
            printf -- '- Version: `%s`\n' "${RELEASE_VERSION}"
            printf -- '- SOURCE_DATE_EPOCH: `%s`\n' "${SOURCE_DATE_EPOCH}"
            printf -- '- Candidate ZIP SHA-256: `%s`\n' "${RELEASE_ZIP_SHA256}"
            printf -- '- Artifact name: `%s`\n' "${ARTIFACT_NAME}"
            printf -- '- Artifact ID: `%s`\n' "${ARTIFACT_ID}"
            printf -- '- Artifact service digest: `%s`\n' "${ARTIFACT_DIGEST}"
            printf -- '- Artifact URL: [%s](%s)\n' "${ARTIFACT_ID}" "${ARTIFACT_URL}"
          } >> "${GITHUB_STEP_SUMMARY}"
