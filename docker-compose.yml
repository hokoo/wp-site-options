name: "${COMPOSE_PROJECT_NAME:-wp-site-options}"

services:
  db:
    image: "${DB_IMAGE:-mariadb:10.11}"
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      MARIADB_DATABASE: "${DB_NAME:?Set DB_NAME in .env}"
      MARIADB_USER: "${DB_USER:?Set DB_USER in .env}"
      MARIADB_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env}"
      MARIADB_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    volumes:
      - db-data:/var/lib/mysql

  wordpress:
    image: "${WORDPRESS_IMAGE:-wordpress:php8.3-apache}"
    init: true
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: "${DB_NAME:?Set DB_NAME in .env}"
      WORDPRESS_DB_USER: "${DB_USER:?Set DB_USER in .env}"
      WORDPRESS_DB_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env}"
      WORDPRESS_DEBUG: "${WP_DEBUG:-1}"
    extra_hosts:
      - "${WP_HOST:-wp-site-options.local}:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 80) ? 0 : 1);'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    ports:
      - "${WP_BIND_ADDRESS:-127.0.0.1}:${WP_HTTP_PORT:-8088}:80"
    volumes:
      - ./:/srv/web
      - ./local-dev:/var/www/html

  wp-cli:
    image: "${WP_CLI_IMAGE:-wordpress:cli-php8.3}"
    init: true
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: "${DB_NAME:?Set DB_NAME in .env}"
      WORDPRESS_DB_USER: "${DB_USER:?Set DB_USER in .env}"
      WORDPRESS_DB_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env}"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        trap 'exit 0' TERM INT
        while :; do sleep 3600; done
    working_dir: /var/www/html
    extra_hosts:
      - "${WP_HOST:-wp-site-options.local}:host-gateway"
    healthcheck:
      test: ["CMD", "wp", "--info"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    volumes:
      - ./:/srv/web
      - ./local-dev:/var/www/html

volumes:
  db-data:
